	async function post_to_server_with_busy_retry(body_object, busy_overlay_text)
	{
		// sends a request to the server, if the server responds with "server_is_buisy" it waits 2 seconds (showing busy_overlay_text) and tries again
		try
		{
			while (true)
			{
				const response = await fetch(g_server_url,
				{
					method: "POST",
					headers: { "Content-Type": "text/plain;charset=utf-8" },
					body: JSON.stringify(body_object)
				});

				const result = await response.json();

				if (result.result === "server_is_buisy")
				{
					showOverlay(busy_overlay_text);
					await new Promise(resolve => setTimeout(resolve, 2000));
					continue;
				}

				return result;
			}
		}
		catch (err)
		{
			console.log("ERROR: post_to_server_with_busy_retry() catch error:" + err.toString());
			return { result: "error", text: "" };
		}
	}

	function show_products()

		if (!g_products_data_from_server || !g_products_data_from_server.data)
			return;

		const rows = g_products_data_from_server.data.rows;

		const products_to_show = rows.filter(row =>
		{
			if (g_show_categories === 1)
				return row[1] === g_current_category_code; // parent_category_code
			else
				return true; // show all products regardless of category
		});

		if (products_to_show.length === 0)
		{
			//document.getElementById('g_products_div').innerHTML =	'<div style="text-align:center; color:#999; padding:20px;">אין מוצרים להצגה בקטגוריה זו</div>';
			document.getElementById('g_products_div').innerHTML =	'<div style="text-align:center; color:#999; padding:20px;"></div>';
			return;
		}

		const products_html = products_to_show.map(row =>
		{
			const product_code            = row[0];
			// row[1] is parent_category_code, used only for filtering above
			const product_name            = row[2];
			const product_description     = row[3];
			const product_price           = parseFloat(row[4]);
			const amount_in_stock         = parseInt(row[5]);
			const thumbnail_image_file    = row[6];
			const product_page_link       = row[7];

			const current_qty = get_product_qty_in_order(product_code);
			const line_total  = (product_price * current_qty).toFixed(0);

			const out_of_stock_note = amount_in_stock <= 0
				? '<div style="color:#c0392b; font-size:12px; margin-top:4px;">אזל מהמלאי</div>'
				: '';

			// NEW: if a product_page_link exists, wrap the image and name in an <a> tag
			const image_html = product_page_link
				? `<a href="${product_page_link}" target="_blank" rel="noopener"><img src="${thumbnail_image_file}" alt="${product_name}" class="product-card-image"></a>`
				: `<img src="${thumbnail_image_file}" alt="${product_name}" class="product-card-image">`;

			const name_html = product_page_link
				? `<a href="${product_page_link}" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">${product_name}</a>`
				: product_name;

			return `
				<div class="product-card" data-product-code="${product_code}">
					${image_html}
					<div class="product-card-info">
						<div class="product-card-name">${name_html}</div>
						<div class="product-card-subtitle">${product_description}</div>
						<div class="product-card-price-row">
							<span class="product-card-price">${product_price} ש"ח</span>
							<div class="qty-control">
								<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', -1);" ${amount_in_stock <= 0 ? 'disabled' : ''}>-</button>
								<input type="text" class="qty-input" value="${current_qty}" readonly>
								<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', 1);" ${amount_in_stock <= 0 ? 'disabled' : ''}>+</button>
							</div>
						</div>
						<div class="product-card-total">סה"כ: ${line_total} ש"ח</div>
						${out_of_stock_note}
					</div>
				</div>`;
		}).join('');

		document.getElementById('g_products_div').innerHTML = products_html;
	}
	

	// helper: looks up the current ordered quantity for a given product_code in g_order.products
	function get_product_qty_in_order(product_code)
	{
		const existing = g_order.products.find(p => p.product_code === product_code);
		return existing ? existing.amount : 0;
	}	
	
	
	function on_product_quantity_change(product_code, amount_to_add)
	{
		// look up the current stock level so we don't let the qty exceed it
		const rows = (g_products_data_from_server && g_products_data_from_server.data)
			? g_products_data_from_server.data.rows
			: [];
		const product_row = rows.find(row => row[0] === product_code);
		const amount_in_stock = product_row ? parseInt(product_row[5]) : 0;

		const existing = g_order.products.find(p => p.product_code === product_code);
		const current_qty = existing ? existing.amount : 0;

		let new_qty = current_qty + amount_to_add;
		if (new_qty < 0) new_qty = 0;
		if (new_qty > amount_in_stock) new_qty = amount_in_stock;

		if (new_qty === 0)
		{
			// remove from order entirely if it exists
			if (existing)
				g_order.products = g_order.products.filter(p => p.product_code !== product_code);
		}
		else if (existing)
		{
			existing.amount = new_qty;
		}
		else
		{
			g_order.products.push({ product_code: product_code, amount: new_qty });
		}

		// re-render the product cards so the qty input / line total reflect the change
		show_products();

		show_cart();
	}

	function show_cart()
	{
		const cart_tbody = document.getElementById('g_cart_tbody');

		if (!g_order.products || g_order.products.length === 0)
		{
			cart_tbody.innerHTML = '<tr><td colspan="5" class="cart-empty-row">העגלה ריקה</td></tr>';
			document.getElementById('g_grand_total').innerText = "0";
			return;
		}

		const rows = (g_products_data_from_server && g_products_data_from_server.data)
			? g_products_data_from_server.data.rows
			: [];

		let grand_total = 0; // raw total, no discount yet

		const items_html = g_order.products.map(order_item =>
		{
			const product_row = rows.find(row => row[0] === order_item.product_code);
			if (!product_row) return '';

			const product_code         = product_row[0];
			const product_name         = product_row[2];
			const product_price        = parseFloat(product_row[4]);
			const thumbnail_image_file = product_row[6];

			const qty        = order_item.amount;
			const line_total_str = (product_price * qty).toFixed(0);

			grand_total += product_price * qty; // just accumulate here

			return `
				<tr>
					<td><img src="${thumbnail_image_file}" alt="${product_name}" class="cart-item-image"></td>
					<td>${product_name}</td>
					<td>
						<div class="qty-control" style="justify-content:center;">
							<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', -1);">-</button>
							<input type="text" class="qty-input" value="${qty}" readonly>
							<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', 1);">+</button>
						</div>
					</td>
					<td>${product_price} ש"ח</td>
					<td>${line_total_str} ש"ח</td>
				</tr>`;
		}).join('');

		let grand_total_str = grand_total.toFixed(0);

		const total_row_html = `
			<tr class="cart-total-row">
				<td></td>
				<td>סה"כ</td>
				<td></td>
				<td></td>
				<td>${grand_total_str} ש"ח</td>
			</tr>`;

		cart_tbody.innerHTML = items_html + total_row_html;

		if(g_discount  > 0)
		{
			// apply the discount only for g_grand_total
			if (g_discount_type_money_or_percentage === "money")
			{
				grand_total -= g_discount;
			}
			else if (g_discount_type_money_or_percentage === "percentage")
			{
				grand_total -= (grand_total * g_discount / 100);
			}

			if (grand_total <= 0)
				grand_total = 0;

			grand_total_str = grand_total.toFixed(0); // toFixed() returns a string
		}
			
		document.getElementById('g_grand_total').innerText = grand_total_str;
	}
	
	
	function show_categories()
	{
		if (!g_categories_data_from_server || !g_categories_data_from_server.data)
			return;

		const rows = g_categories_data_from_server.data.rows;

		// show only categories whose parent_category matches the currently open category
		const categories_to_show = rows.filter(row => row[2] === g_current_category_code);

		// the "home" tile is always shown first and always jumps back to root
		const home_html = `
			<div class="category-item" onclick="g_current_category_code='root'; show_category();">
				<img src="https://i.ibb.co/601Zp24x/home.png" alt="עמוד ראשי" class="category-item-image">
				<div class="category-item-name">עמוד ראשי</div>
			</div>`;

		const categories_html = categories_to_show.map(row =>
		{
			const category_code         = row[0];
			const category_name         = row[1];
			// row[2] is parent_category, used only for filtering above
			const thumbnail_image_file  = row[3];

			return `
				<div class="category-item" onclick="g_current_category_code='${category_code}'; show_category();">
					<img src="${thumbnail_image_file}" alt="${category_name}" class="category-item-image">
					<div class="category-item-name">${category_name}</div>
				</div>`;
		}).join('');

		document.getElementById('g_categories_div').innerHTML = home_html + categories_html;
	}

	function getServerUrl() 
	{
		const xhr = new XMLHttpRequest();
		const cacheBuster = new Date().getTime(); // unique value each call to prevent from getting a chached version
		if(g_work_mode == "dev")
			xhr.open("GET", "https://beensman.github.io/rnt-dev/server_url.txt?v=" + cacheBuster, false); // false = synchronous
		else
			xhr.open("GET", "https://beensman.github.io/rnt/server_url.txt?v=" + cacheBuster, false); // false = synchronous
		xhr.send();
		if (xhr.status === 200) 
		{
			return xhr.responseText.trim();
		} 
		else 
		{
			return "";
		}
	}

	async function on_main_button_click(btn)
	{
		showOverlay("הזמנתך בבדיקה");
		
		g_order.customer_name = document.getElementById('g_customer_name').value;
		g_order.customer_phone = document.getElementById('g_phone_input').value;
		//g_order.customer_email = document.getElementById('g_customer_email').value;
		g_order.customer_comments = document.getElementById('g_customer_comments').value;
		g_order.pickup_point_code = document.getElementById('g_pickup_points_select').value;
		g_order.coupon_code = document.getElementById('g_coupon_code_input').value;
		g_order.verification_code = document.getElementById('g_verification_code').value;
		g_order.terms_accepted      = document.getElementById('g_terms_checkbox').checked;
		g_order.sms_reminder_opt_in = document.getElementById('g_sms_reminder_checkbox').checked;
		g_order.marketing_opt_in    = document.getElementById('g_marketing_opt_in_checkbox').checked;
					
		//document.getElementById('g_customer_comments').value = JSON.stringify(g_order); // for debug
		
		let result = await create_new_order();
		
		hideOverlay();
		
		// result.result is only set on "error" (run time error thrown server side) - on a normal create_new_order response there is no result.result field
		if (result.result === "error")
		{
			console.log("ERROR: on_main_button_click() server error:" + JSON.stringify(result));
			alert("ארעה שגיאה בשרת, אנא נסו שוב");
			return;
		}
		
		if (result.is_success != 1)
		{
			if (result.did_approve_user_agreement == 0)
			{
				alert("יש לאשר את תנאי השימוש");
			}
			else if (result.is_verification_code_valid == 0)
			{
				alert("הקוד שהוזן אינו תקין יש לאמת את מספר הטלפון וללחוץ על שלחו לי קוד אימות");
			}
			else if (result.is_a_valid_pickup_point == 0)
			{
				alert("יש לבחור נקודת איסוף");
			}
			else if (result.is_a_product_out_of_stock == 1)
			{
				alert("אחד או יותר מהמוצרים שנבחרו אזל מהמלאי, אנא רעננו את העמוד ונסו שוב");
			}
			else if (result.is_a_valid_coupon == 0)
			{
				alert("קוד הקופון שהוזן אינו תקין");
			}
			else
			{
				alert("ארעה שגיאה, אנא נסו שוב");
			}
			
			return;
		}
		
		// is_success == 1 from here on
		
		if (result.discount > 0)
		{
			if (result.discount_type_money_or_percentage === "percentage")
			{
				document.getElementById('g_discount_text').value = "הנחה: " + result.discount + "%";
			}
			else
			{
				document.getElementById('g_discount_text').value = "הנחה: " + result.discount + ' ש"ח';
			}
			
			document.getElementById('g_grand_total').innerText = result.total_price_to_be_paid;
			
			alert("הקופון נקלט בהצלחה והמחיר עודכן בהתאם");
		}
		
		if(result.clearance_page_url == "" || result.total_price_to_be_paid == 0) // it means the coupon covered all the payment and there is nothing left to pay
		{
			alert("הזמנתך נתקבלה בהצלחה, נשלחו אליך הפרטים המלאים של נקודת האיסוף, תודה על קנייתך");
			return;
		}
		
		alert("הזמנתך נתקבלה בהצלחה, מיד תועבר אל עמוד התשלום, לאחר שהמערכת שלנו תקבל אישור על התשלום ישלחו אליך הפרטים המלאים של נקודת האיסוף, תודה על קנייתך");
		
		// redirect him to the clearance page
		window.location.href = result.clearance_page_url;
	}

			flex: none;
			padding: 10px 8px;
			text-align: center;
			font-weight: bold;
			color: #1d7c45;
			background: #eaf6ef;
			cursor: default;
		}

		/* two side-by-side clickable "button-cards" for choosing the delivery method (no radio inputs) */

		.delivery-method-options
		{
			display: flex;
			gap: 10px;
			background-color: yellow;
			padding: 8px;
			border-radius: 14px;
		}

		.delivery-method-option
		{
			flex: 1;
			text-align: center;
			background: white;
			border: 2px solid #ccc;
			border-radius: 12px;
			padding: 8px 6px;
			font-size: 14px;
			font-weight: normal;
			cursor: pointer;
			margin-bottom: 0;
			line-height: 1.3;
			user-select: none;
		}

		.delivery-method-option.selected
		{
			border-color: #1d7c45;
			background: #eaf6ef;
			font-weight: bold;
			color: #1d7c45;
		}


		/* PRODUCT CARD */

		.product-card
		{
			border: 1px solid #ddd;
			border-radius: 12px;
			background: white;
			padding: 10px;
			margin-bottom: 12px;
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.product-card-image
		{
			width: 100px;
			height: 100px;
			object-fit: cover;
			border-radius: 8px;
			flex-shrink: 0;
		}

		.product-card-info
		{
			flex: 1;
		}

		.product-card-name
		{
			font-weight: bold;
			font-size: 16px;
			margin-bottom: 4px;
		}

		.product-card-subtitle
		{
			font-size: 13px;
			color: #666;
			margin-bottom: 8px;
		}

		.product-card-price-row
		{
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 6px;
		}

		.product-card-price
		{
			font-weight: bold;
			font-size: 15px;
		}

		.qty-control
		{
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.qty-btn
		{
			width: 28px;
			height: 28px;
			border: none;
			border-radius: 8px;
			background: #1d7c45;
			color: white;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
		}

		.qty-input
		{
			width: 40px;
			padding: 4px;
			text-align: center;
			border-radius: 8px;
		}

		.product-card-total
		{
			font-size: 13px;
			color: #1d7c45;
			font-weight: bold;
		}


		/* CATEGORIES */

		#g_categories_div
		{
			display: grid;
			grid-template-columns: repeat(5, 1fr);
			gap: 6px;
			margin-top: 15px;
		}

		.category-item
		{
			border: 1px solid #ddd;
			border-radius: 12px;
			background: white;
			padding: 6px 2px;
			width: auto;
			text-align: center;
			cursor: pointer;
			user-select: none;
		}

		.category-item-image
		{
			width: 100%;
			max-width: 55px;
			height: 55px;
			object-fit: cover;
			border-radius: 8px;
			margin-bottom: 4px;
		}

		.category-item-name
		{
			font-size: 12px;
			font-weight: bold;
			line-height: 1.2;
		}

		/* DISABLED FIELDS - visual cue that these are intentionally locked */

		input:disabled,
		select:disabled,
		textarea:disabled
		{
			background: #eee;
			color: #999;
			border: 1px dashed #bbb;
			cursor: not-allowed;
		}

		button:disabled
		{
			background: #bbb;
			color: #eee;
			cursor: not-allowed;
			opacity: 0.7;
		}

	</style>
	
</head>

<body onload="on_page_load();">

	<!-- LOADING OVERLAY -->
	<div id="g_loading_overlay">
		<div class="loading-box"><span id="g_overlay_text">טקסט להחלפה</span></div>
	</div>

	<!-- LOGO & WELCOME TEXT -->
	<div class="container">
		<img src="https://beensman.github.io/rnt-dev/logo_medium.png" alt="לוגו רומיה ותמר" class="logo"> <!-- https://i.ibb.co/2L4HRRz/logo-medium.png -->
		<div class="welcome-text">ברוכים הבאים לחנות של רומיה ותמר</div>
		<div class="welcome-link"><a href="https://www.rumyah-and-tamar.com/">הצטרפו כנקודת איסוף עצמי וקבלו כסף ומוצרים בחינם! לחצו כאן לפרטים!</a></div>
	</div>

	<!-- PRODUCTS / CATEGORIES (מתחם עליון) -->
	<div class="container" id="g_category_div"> <!-- category contain products and sub categories -->
		<div id="g_products_div">
	
		</div>
		<div id="g_categories_div">
			
		</div>
	</div>

	<!-- SHOPPING CART (מתחם אמצעי) -->
	<div class="container" id="g_cart_div">
		<table class="cart-table">
			<thead>
				<tr>
					<th>תמונה</th>
					<th>שם המוצר</th>
					<th>כמות</th>
					<th>מחיר</th>
					<th>סה"כ</th>
				</tr>
			</thead>
			<tbody id="g_cart_tbody">
				<tr><td colspan="5" class="cart-empty-row">העגלה ריקה</td></tr>
			</tbody>
		</table>
	</div>

	<!-- REST OF THE FORM (מתחם תחתון) -->
	<div class="container">

		<div class="form-card">

			<!-- ==== SECTION 1: terms, phone verification, coupon ==== -->

			<div class="checkbox-group" id="g_terms_checkbox_group">
				<input type="checkbox" id="g_terms_checkbox" onchange="on_terms_checkbox_change();"><label for="g_terms_checkbox">קראתי ואני מסכים ומקבל את התקנון ותנאי השימוש באתר.</label>
			</div>

			<div class="form-group">
				<label>מספר טלפון ישראלי</label>
				<div class="input-with-button">
					<input type="text" id="g_phone_input" class="phone-input">
					<button id="g_send_verification_code_button" onclick="on_click_send_verification_code();">שלחו לי קוד</button>
					<input type="text" id="g_verification_code" class="verification-input" placeholder="קוד אימות" oninput="on_verification_code_input();">
				</div>
			</div>
			
			<!--
			<div class="info-text">
				המערכת תשלח קוד אימות בהודעת טקסט אל המספר שהוזן,
				אנא וודאו כי המספר נכון
			</div>
			-->

			<div class="form-group">
				<label>קוד קופון</label>
				<div class="input-with-button">
					<input type="text" id="g_coupon_code_input" class="coupon-input">
					<button id="g_apply_coupon_button" onclick="on_click_apply_coupon();">החל קופון</button>
					<input type="text" id="g_discount_text" class="discount-input" placeholder="הנחה" value="0 ש&quot;ח" readonly>
				</div>
			</div>

			<!-- TOTAL AFTER DISCOUNT -->
			<div class="payment-total">
				סה"כ לתשלום לאחר הנחה: <span id="g_grand_total">0</span> ש"ח
			</div>

			<hr class="section-divider">

			<!-- ==== SECTION 2: delivery method selection ==== -->

			<div class="form-group">
				<div class="delivery-method-options" id="g_delivery_method_options">
					<div class="delivery-method-option" data-value="pickup" onclick="onDeliveryMethodChanged(this);">איסוף עצמי ליד הבית (0 ש"ח)</div>
					<div class="delivery-method-option" data-value="home_delivery" onclick="onDeliveryMethodChanged(this);">משלוח עד הבית (30 ש"ח)</div>
				</div>
			</div>

			<hr class="section-divider">

			<!-- ==== SECTION 3: pickup point OR home delivery address, shown according to the selection above ==== -->

			<div id="g_pickup_section" style="display:none;">

				<div class="form-group">
					<label>בחרו נקודה לאיסוף עצמי <span class="label-note">(לאחר ביצוע ההזמנה נשלח אליכם פרטים מלאים)</span></label>

					<select id="g_pickup_points_select" onchange="onPickupPointChanged(this);" style="background-color: yellow;">
						</option>
					</select>
				</div>

				<div class="delivery-date-info-text" id="g_pickup_delivery_date_info"></div>

			</div>

			<div id="g_delivery_section" style="display:none;">

				<!-- NEW: home delivery date/time info box, same style as the pickup one, shown above the city/street row -->
				<div class="delivery-date-info-text" id="g_courier_delivery_date_info">
				</div>

				<div class="form-row">
					<div class="form-group">
						<label>עיר</label>
						<select id="g_city_select" style="background-color: yellow;">
							<option value="not_selected">יש לבחור עיר</option>
						</select>
					</div>

					<div class="form-group">
						<label>רחוב</label>
						<input type="text" id="g_street_input">
					</div>
				</div>

				<div class="form-row">
					<div class="form-group">
						<label>מספר בית</label>
						<input type="text" id="g_house_number_input">
					</div>

					<div class="form-group">
						<label>מספר דירה</label>
						<input type="text" id="g_apartment_number_input">
					</div>
				</div>

			</div>

			<hr class="section-divider">

			<!-- TOTAL INCLUDING SHIPPING -->
			<div class="payment-total">
				סה"כ לתשלום כולל משלוח: <span id="g_grand_total_with_shipping">0</span> ש"ח
			</div>

			<!-- ==== SECTION 4: customer details, comments, opt-ins, submit ==== -->

			<div class="form-group">
				<label>שם מלא</label>
				<input type="text" id="g_customer_name">
			</div>

			<div class="form-group">
				<label>הערות לקוח</label>
				<textarea rows="4" id="g_customer_comments"></textarea>
			</div>

			<div class="checkbox-group">
				<input type="checkbox" id="g_sms_reminder_checkbox">
				<label for="g_sms_reminder_checkbox">שלחו לי תזכורת אחת לשבוע (כיומיים לפני מועד האספקה) עם קישור להזמנה מהירה.</label>
			</div>

			<div class="checkbox-group">
				<input type="checkbox" id="g_marketing_opt_in_checkbox">
				<label for="g_marketing_opt_in_checkbox">ברצוני לקבל מידע על מוצרים חדשים ומבצעים.</label>
			</div>

			<button class="main-button" id="g_main_button" onclick="on_main_button_click(this);">
				מעבר אל עמוד התשלום
			</button>

		</div>

	</div>

</body>
</html>
