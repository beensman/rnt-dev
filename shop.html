	function showOverlay(overlay_text)

		}
		catch(error)
		{
		  console.log("ERROR: showOverlay() catch error:" + error);
		}
	}

	{

		{
			document.getElementById('g_loading_overlay').style.display = 'none';
		}
		catch(error)
		{
		  console.log("ERROR: hideOverlay() catch error:" + error);
		}
	}


	async function post_to_server_with_busy_retry(body_object)
	{
		try
		{
			let result, response;
			
			for(let i=0; i<10; i++)
			{
				try
				{
					response = await fetch(g_server_url,
					{
						method: "POST",
						headers: { "Content-Type": "text/plain;charset=utf-8" },
						body: JSON.stringify(body_object)
					});

					result = await response.json();

					if (result.result === "server_is_buisy")
					{
						showOverlay("השרת עמוס, ממתין 2 שניות ומנסה שנית, אנא המתינו");
						await new Promise(resolve => setTimeout(resolve, 2000)); // sleep
						continue;
					}
					else if (result.result === "server_under_maintenance")
					{
						showOverlay("השרת בתחזוקה, ממתין 5 שניות ומנסה שנית, אנא המתינו....");
						await new Promise(resolve => setTimeout(resolve, 5000));
						continue;
					}

					return result;
				}
				catch(error)
				{
					showOverlay("חלה שגיאה בתקשורת מול השרת, ממתין מספר שניות ומנסה שנית");
					console.log("ERROR: post_to_server_with_busy_retry() catch1 error:" + error);
					console.log("ERROR: post_to_server_with_busy_retry() catch1 body_object:" + JSON.stringify(body_object));
					await new Promise(resolve => setTimeout(resolve, 5000));
					continue;
				}
			}
		
			return result;	
		}
		catch(error)
		{
			console.log("ERROR: post_to_server_with_busy_retry() catch2 error:" + error);
			console.log("ERROR: post_to_server_with_busy_retry() catch2 body_object:" + JSON.stringify(body_object));
			throw error;
		}
	}

	function show_category()

	// Converts a single row array into an object keyed by column name, using the
	// headers array returned from the server. This way, if the server changes the
	// column order (or adds new columns), the code keeps working since it looks
	// up fields by name instead of by fixed position.
	function row_to_object(row, headers)
	{
		try
		{
			const obj = {};
			headers.forEach((header_name, index) =>
			{
				obj[header_name] = row[index];
			});
			return obj;
		}
		catch(error)
		{
		  console.log("ERROR: row_to_object() catch error:" + error);
		}
	}


	function show_products()
	{
		try
		{
			if (!g_products_data_from_server || !g_products_data_from_server.data)
				return;

			const headers = g_products_data_from_server.data.headers;
			const rows    = g_products_data_from_server.data.rows;

			const products_to_show = rows.filter(row =>
			{
				const product = row_to_object(row, headers);

				if (g_show_categories === 1)
					return product.parent_category_code === g_current_category_code;
				else
					return true; // show all products regardless of category
			});

			if (products_to_show.length === 0)
			{
				document.getElementById('g_products_div').innerHTML =	'<div style="text-align:center; color:#999; padding:20px;">אין מוצרים להצגה בקטגוריה זו</div>';
				return;
			}

			const products_html = products_to_show.map(row =>
			{
				const product = row_to_object(row, headers);

				const product_code            = product.product_code;
				const product_name            = product.product_name;
				const product_description     = product.product_description;
				const product_price           = parseFloat(product.product_price_including_vat);
				const amount_in_stock         = parseInt(product.amount_in_stock);
				const thumbnail_image_file    = product.thumbnail_image_file;
				const product_page_link   	  = product.product_page_link;
				const net_content_gr_ml       = parseFloat(product.net_content_gr_ml);
				const show_price_per_100_units       = parseInt(product.show_price_per_100_units);
				const units_of_price_per_100_units       = product.units_of_price_per_100_units;
				
				const price_per_100_units = (net_content_gr_ml > 0 && !isNaN(product_price)) ? (product_price / net_content_gr_ml) * 100 : 0;
				
				const current_qty = get_product_qty_in_order(product_code);
				const line_total  = (product_price * current_qty).toFixed(0);

				const out_of_stock_note = amount_in_stock <= 0
					? '<div style="color:#c0392b; font-size:12px; margin-top:4px;">אזל מהמלאי</div>'
					: '';

				// NEW: if a product_page_link exists, wrap the image and name in an <a> tag
				const image_html = product_page_link
					? `<a href="${product_page_link}" target="_blank" rel="noopener"><img src="${thumbnail_image_file}" alt="${product_name}" class="product-card-image"></a>`
					: `<img src="${thumbnail_image_file}" alt="${product_name}" class="product-card-image">`;

				const name_html = product_page_link
					? `<a href="${product_page_link}" target="_blank" rel="noopener" style="color:inherit; text-decoration:none;">${product_name}</a>`
					: product_name;

				return `
					<div class="product-card" data-product-code="${product_code}">
						${image_html}
						<div class="product-card-info">
							<div class="product-card-name">${name_html}</div>
							<div class="product-card-subtitle">${product_description}, ${show_price_per_100_units === 1 ? price_per_100_units.toFixed(2) + ' ' + units_of_price_per_100_units : ''}</div>
							<div class="product-card-price-row">
								<span class="product-card-price">${product_price} ש"ח</span>
								<div class="qty-control">
									<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', -1);" ${amount_in_stock <= 0 ? 'disabled' : ''}>-</button>
									<input type="text" class="qty-input" value="${current_qty}" readonly>
									<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', 1);" ${amount_in_stock <= 0 ? 'disabled' : ''}>+</button>
								</div>     
							</div>
							<div class="product-card-total">סה"כ: ${line_total} ש"ח</div>
							${out_of_stock_note}
						</div>
					</div>`;
			}).join('');

			document.getElementById('g_products_div').innerHTML = products_html;
		}
		catch(error)
		{
		  console.log("ERROR: show_products() catch error:" + error);
		}
	}
	

	// helper: looks up the current ordered quantity for a given product_code in g_order.products
	function get_product_qty_in_order(product_code)
	{
		try
		{
			const existing = g_order.products.find(p => p.product_code === product_code);
			return existing ? existing.amount : 0;
		}
		catch(error)
		{
		  console.log("ERROR: get_product_qty_in_order() catch error:" + error);
		}
	}	
	
	
	function on_product_quantity_change(product_code, amount_to_add)
	{
		try
		{
			// look up the current stock level so we don't let the qty exceed it
			const headers = (g_products_data_from_server && g_products_data_from_server.data)
				? g_products_data_from_server.data.headers
				: [];
			const rows = (g_products_data_from_server && g_products_data_from_server.data)
				? g_products_data_from_server.data.rows
				: [];

			const product_row = rows.find(row => row_to_object(row, headers).product_code === product_code);
			const product = product_row ? row_to_object(product_row, headers) : null;
			const amount_in_stock = product ? parseInt(product.amount_in_stock) : 0;

			const existing = g_order.products.find(p => p.product_code === product_code);
			const current_qty = existing ? existing.amount : 0;

			let new_qty = current_qty + amount_to_add;
			if (new_qty < 0) new_qty = 0;
			if (new_qty > amount_in_stock) new_qty = amount_in_stock;

			if (new_qty === 0)
			{
				// remove from order entirely if it exists
				if (existing)
					g_order.products = g_order.products.filter(p => p.product_code !== product_code);
			}
			else if (existing)
			{
				existing.amount = new_qty;
			}
			else
			{
				g_order.products.push({ product_code: product_code, amount: new_qty });
			}

			// re-render the product cards so the qty input / line total reflect the change
			show_products();

			show_cart();
		}
		catch(error)
		{
		  console.log("ERROR: on_product_quantity_change() catch error:" + error);
		}
	}	
	
	
	function show_cart()
	{
		try
		{
			const cart_tbody = document.getElementById('g_cart_tbody');

			if (!g_order.products || g_order.products.length === 0)
			{
				cart_tbody.innerHTML = '<tr><td colspan="5" class="cart-empty-row">העגלה ריקה</td></tr>';
				document.getElementById('g_grand_total').innerText = "0";
				document.getElementById('g_grand_total_with_shipping').innerText = "0";
				document.getElementById('g_discount_text').value = "";
				return; 
			}

			const headers = (g_products_data_from_server && g_products_data_from_server.data)
				? g_products_data_from_server.data.headers
				: [];
			const rows = (g_products_data_from_server && g_products_data_from_server.data)
				? g_products_data_from_server.data.rows
				: [];

			let grand_total = 0; // raw total, no discount yet

			const items_html = g_order.products.map(order_item =>
			{
				const product_row = rows.find(row => row_to_object(row, headers).product_code === order_item.product_code);
				if (!product_row) return '';

				const product = row_to_object(product_row, headers);

				const product_code         = product.product_code;
				const product_name         = product.product_name;
				const product_price        = parseFloat(product.product_price_including_vat);
				const thumbnail_image_file = product.thumbnail_image_file;

				const qty        = order_item.amount;
				const line_total_str = (product_price * qty).toFixed(0);

				grand_total += product_price * qty; // just accumulate here

				return `
					<tr>
						<td><img src="${thumbnail_image_file}" alt="${product_name}" class="cart-item-image"></td>
						<td>${product_name}</td>
						<td>
							<div class="qty-control" style="justify-content:center;">
								<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', -1);">-</button>
								<input type="text" class="qty-input" value="${qty}" readonly>
								<button class="qty-btn" onclick="on_product_quantity_change('${product_code}', 1);">+</button>
							</div>
						</td>
						<td>${product_price} ש"ח</td>
						<td>${line_total_str} ש"ח</td>
					</tr>`;
			}).join('');

			let grand_total_str = grand_total.toFixed(0);

			const total_row_html = `
				<tr class="cart-total-row">
					<td></td>
					<td>סה"כ</td>
					<td></td>
					<td></td>
					<td>${grand_total_str} ש"ח</td>
				</tr>`;

			cart_tbody.innerHTML = items_html + total_row_html;
			
			if(g_discount > 0)
			{
				// apply the discount only for g_grand_total
				if (g_discount_type_money_or_percentage === "money")
				{
					grand_total -= g_discount;
					document.getElementById('g_discount_text').value = g_discount + '- ש"ח';
				}
				else if (g_discount_type_money_or_percentage === "percentage")
				{
					grand_total -= (grand_total * g_discount / 100);
					document.getElementById('g_discount_text').value = "%" + g_discount + "-";
				}

				if (grand_total <= 0)
					grand_total = 0;

				grand_total_str = grand_total.toFixed(0); // toFixed() returns a string
			}
			else
			{
				document.getElementById('g_discount_text').value = "";
			}

				
			document.getElementById('g_grand_total').innerText = grand_total_str;
			
			if(grand_total > 0)
			{
				if(g_order.delivery_type === "courier_to_home")
				{
					if(grand_total < g_configuration_data_from_server.minimum_order_price_for_courier_delivery_to_home)
						document.getElementById('g_minimum_notice').innerHTML = "<tr><td>הזמנתך מתחת למינימום הנדרש למשלוח עד הבית באמצעות שליח</td></tr>";
					else
						document.getElementById('g_minimum_notice').innerHTML = "";
					
					grand_total_str = (grand_total + g_configuration_data_from_server.courier_delivery_to_home_price_for_customers_including_vat).toFixed(0); 
				}
				else
				{
					if(grand_total < g_configuration_data_from_server.minimum_order_price_for_delivery_to_pickup_point)
						document.getElementById('g_minimum_notice').innerHTML = "<tr><td>הזמנתך מתחת למינימום הנדרש למשלוח אל נקודת איסוף עצמי ליד הבית</td></tr>";
					else
						document.getElementById('g_minimum_notice').innerHTML = "";

					grand_total_str = (grand_total + g_configuration_data_from_server.delivery_to_pickup_point_price_for_customers_including_vat).toFixed(0); 
				}
			}

			document.getElementById('g_grand_total_with_shipping').innerText = grand_total_str;
		}
		catch(error)
		{
		  console.log("ERROR: show_cart() catch error:" + error);
		}
	}
	
	
	function show_categories()
	{
		try
		{
			if (!g_categories_data_from_server || !g_categories_data_from_server.data)
				return;

			const headers = g_categories_data_from_server.data.headers;
			const rows    = g_categories_data_from_server.data.rows;

			// show only categories whose parent_category matches the currently open category
			const categories_to_show = rows.filter(row => row_to_object(row, headers).parent_category === g_current_category_code);

			// the "home" tile is always shown first and always jumps back to root
			const home_html = `
				<div class="category-item" onclick="g_current_category_code='root'; show_category();">
					<img src="https://i.ibb.co/601Zp24x/home.png" alt="עמוד ראשי" class="category-item-image">
					<div class="category-item-name">עמוד ראשי</div>
				</div>`;

			const categories_html = categories_to_show.map(row =>
			{
				const category = row_to_object(row, headers);

				const category_code         = category.category_code;
				const category_name         = category.category_name;
				// category.parent_category is used only for filtering above
				const thumbnail_image_file  = category.thumbnail_image_file;

				return `
					<div class="category-item" onclick="g_current_category_code='${category_code}'; show_category();">
						<img src="${thumbnail_image_file}" alt="${category_name}" class="category-item-image">
						<div class="category-item-name">${category_name}</div>
					</div>`;
			}).join('');

			document.getElementById('g_categories_div').innerHTML = home_html + categories_html;
		}
		catch(error)
		{
		  console.log("ERROR: show_categories() catch error:" + error);
		}
	}


	async function get_products()
	{
	  try 
	  {

	function getServerUrl() 
	{
		try
		{
			const xhr = new XMLHttpRequest();
			const cacheBuster = new Date().getTime(); // unique value each call to prevent from getting a chached version
			if(g_work_mode == "dev")
				xhr.open("GET", "https://beensman.github.io/rnt-dev/server_url.txt?v=" + cacheBuster, false); // false = synchronous
			else
				xhr.open("GET", "https://beensman.github.io/rnt/server_url.txt?v=" + cacheBuster, false); // false = synchronous
			xhr.send();
			if (xhr.status === 200) 
			{
				return xhr.responseText.trim();
			} 
			else 
			{
				return "";
			}
		}
		catch(error)
		{
		  console.log("ERROR: getServerUrl() catch error:" + error);
		  return "";
		}
	}

	async function on_page_load()
	{
		try
		{
			showOverlay("טוען נתונים מהשרת ...");
			
			set_initial_field_states();
			
			// show "delivery to home "
			on_change_delivery_type("to_home");		
			
			g_server_url = getServerUrl();
			if(g_server_url == "")
			{
				alert("לא מצליח להתחבר אל שרת הקבצים, לחץ על אישור לנסות שנית");
				hideOverlay();
				location.reload();
			}
			
			console.log("g_server_url = " + g_server_url);
			
			// await new Promise(resolve => setTimeout(resolve, 1000)); // pause execution, sleep for 1 second (1000 miliseconds) - same code as bellow - save for future use
			
			await new Promise((resolve, reject) => { setTimeout(() => { resolve(); }, 200); }); // pause execution, sleep for 200 milliseconds - save for future use - this is mandatory to allow  getServerUrl() XHR to finish properly, without this we have race issues (google chrome bug)
			
			await Promise.allSettled([get_configuration_data(), get_categories(), get_products(), get_pickup_points(), get_delivery_cities()]);
			
			await new Promise(resolve => setTimeout(resolve, 200)); // sleep 200  ms
			
			if(g_configuration_data_from_server.result != "ok" || g_categories_data_from_server.result != "ok" || g_products_data_from_server.result != "ok" || g_pickup_points_data_from_server.result != "ok" || g_delivery_cities_data_from_server.result != "ok")
			{
				alert("בשל בעיות תקשורת לא הצלחנו לקבל מהשרת נתונים חיוניים, לחץ על אישור לנסות שנית");
				hideOverlay();
				//location.reload();
			}
			
			show_category();

			document.getElementById('g_pickup_tab').innerHTML = "איסוף עצמי ליד הבית (" + g_configuration_data_from_server.delivery_to_pickup_point_price_for_customers_including_vat.toFixed(0) + " שח)" + "<br>" + "מינימום הזמנה (" + g_configuration_data_from_server.minimum_order_price_for_delivery_to_pickup_point + " שח)";
			
			document.getElementById('g_to_home_tab').innerHTML = "משלוח עד הבית (" + g_configuration_data_from_server.courier_delivery_to_home_price_for_customers_including_vat.toFixed(0) + " שח)" + "<br>" + "מינימום הזמנה (" + g_configuration_data_from_server.minimum_order_price_for_courier_delivery_to_home + " שח)";
		
			hideOverlay();
			
			fill_coupon_code_from_url();
			
			if(g_work_mode === "production")
			{
				// set timer to reload the page after 6 hours - in case the user left the web site open for a long time, we need to make sure he get the updated prices and stocks
				setTimeout(on_page_load, 21600000); // 6*60*60*1000=21600000
			}
		}
		catch(error)
		{
			console.log("ERROR: on_page_load() catch error:" + error);
			alert("בשל בעיות תקשורת לא הצלחנו לקבל מהשרת נתונים חיוניים, לחץ על אישור לנסות שנית");
			hideOverlay();
			//location.reload();
		}
	}

	async function on_click_apply_coupon()
	{
		try
		{
			showOverlay("המערכת בודקת את הקופון");

			g_discount = 0;
			g_discount_type_money_or_percentage = "";
			
			const targetPhone = document.getElementById('g_phone_input').value;
			
			const coupon_code_input = document.getElementById('g_coupon_code_input').value;
			
			const verification_code_input = document.getElementById('g_verification_code').value; 
			
			const result = await post_to_server_with_busy_retry(
				{ action: "is_a_valid_coupon", coupon_code: coupon_code_input, customer_phone_number: targetPhone, verification_code: verification_code_input },
				"השרת עמוס, מנסה שוב, אנא המתינו..."
			);
			
			//example response: {"result":"ok","validity_results":{"is_valid":0,"is_a_new_customer":0,"discount":0,"discount_type_money_or_percentage":""}}
			
			hideOverlay();

			if (result.result === "ok") 
			{
				if(result.validity_results.is_valid !== 1)

	function on_terms_checkbox_change()

				document.getElementById('g_phone_input').disabled = false;
				document.getElementById('g_send_verification_code_button').disabled = false;

				document.getElementById('g_phone_input').disabled = true;
				document.getElementById('g_send_verification_code_button').disabled = true;

		}
		catch(error)

				</div>

				<div class="form-row">
					<div class="form-group">
						<label>עיר</label>
						<select id="g_city_select" onchange="on_city_changed();" style="background-color: yellow;">
							<option value="not_selected">יש לבחור עיר</option>
						</select>
					</div>

					<div class="form-group">
						<label>רחוב</label>
						<input type="text" id="g_street_input">
					</div>
				</div>

				<div class="form-row">
					<div class="form-group">
						<label>מספר בית</label>
						<input type="text" id="g_house_number_input">
					</div>

					<div class="form-group">
						<label>מספר דירה</label>
						<input type="text" id="g_apartment_number_input">
					</div>
				</div>

			</div>

			<hr class="section-divider">

			<!-- TOTAL INCLUDING SHIPPING -->
			<div class="payment-total">
				סה"כ לתשלום כולל משלוח: <span id="g_grand_total_with_shipping">0</span> ש"ח
			</div>

			<!-- ==== SECTION 4: customer details, comments, opt-ins, submit ==== -->

			<div class="form-group">
				<label>שם מלא</label>
				<input type="text" id="g_customer_name">
			</div>

			<div class="form-group">
				<label>הערות לקוח</label>
				<textarea rows="4" id="g_customer_comments"></textarea>
			</div>

			<div class="checkbox-group">
				<input type="checkbox" id="g_sms_reminder_checkbox">
				<label for="g_sms_reminder_checkbox">שלחו לי תזכורת אחת לשבוע (כיומיים לפני מועד האספקה) עם קישור להזמנה מהירה.</label>
			</div>

			<div class="checkbox-group">
				<input type="checkbox" id="g_marketing_opt_in_checkbox">
				<label for="g_marketing_opt_in_checkbox">ברצוני לקבל מידע על מוצרים חדשים ומבצעים.</label>
			</div>

			<button class="main-button" id="g_main_button" onclick="on_main_button_click(this);">
				מעבר אל עמוד התשלום
			</button>

		</div>

	</div>

</body>
</html>
